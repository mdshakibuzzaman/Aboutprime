<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime Number Animator</title>
<style>
:root{--bg:#f3f5f8;--fg:#14202e;--mut:#5d6b7c;--card:#fff;--line:#d5dce6;--pr:#0b7a75;--prt:#fff;--co:#e6eaf0;--hi:#e0412f;--mk:#f6b9b0;--ac:#14202e;--act:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d141d;--fg:#e8eef5;--mut:#92a0b2;--card:#162130;--line:#2a3a4f;--pr:#3fd0c4;--prt:#06201e;--co:#1d2b3c;--hi:#ff6b57;--mk:#5b2e2a;--ac:#e8eef5;--act:#0d141d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d141d;--fg:#e8eef5;--mut:#92a0b2;--card:#162130;--line:#2a3a4f;--pr:#3fd0c4;--prt:#06201e;--co:#1d2b3c;--hi:#ff6b57;--mk:#5b2e2a;--ac:#e8eef5;--act:#0d141d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 32px}
h1{font:700 1.6rem/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button,.ctl button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer}
.tabs button[aria-pressed="true"],#play{background:var(--ac);color:var(--act);border-color:var(--ac)}
button:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.sl{display:flex;align-items:center;gap:8px;flex:1 1 200px;color:var(--mut);font-size:.9rem}
.sl input{flex:1;accent-color:var(--pr)}
.sl b{color:var(--fg);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.stage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
canvas{display:block;margin:0 auto;max-width:100%}
#info{margin:12px 0 0;min-height:3em}
#stat{color:var(--mut);font-variant-numeric:tabular-nums}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mut);margin-top:8px}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
</style></head><body><main>
<h1>Prime number animator</h1>
<p class="sub">Watch primes appear, one step at a time.</p>
<div class="tabs" role="group" aria-label="Animation type">
<button id="t-sieve" aria-pressed="true">Sieve of Eratosthenes</button>
<button id="t-ulam" aria-pressed="false">Ulam spiral</button>
<button id="t-gap" aria-pressed="false">Prime gaps</button></div>
<div class="stage"><canvas id="cv"></canvas></div>
<div class="key" id="key"></div>
<div class="ctl">
<button id="play">Play</button><button id="step">Step</button><button id="reset">Reset</button></div>
<div class="ctl">
<label class="sl">Numbers <input id="n" type="range"><b id="nv"></b></label>
<label class="sl">Speed <input id="sp" type="range" min="1" max="20" value="6"><b id="spv">6</b></label></div>
<p id="info"></p><p id="stat"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let mode='sieve',N=100,st,playing=false,acc=0,W=300;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const CFG={sieve:{min:20,max:3000,val:100,key:[['--card','Not checked'],['--pr','Prime'],['--co','Composite'],['--mk','Being crossed out']]},
ulam:{min:100,max:100000,val:2500,key:[['--pr','Prime'],['--hi','Newest number']]},
gaps:{min:100,max:100000,val:2000,key:[['--pr','Twin primes (gap 2)'],['--mut','Other gap'],['--hi','Record gap so far']]}};
function fit(){W=Math.min(cv.parentElement.clientWidth-16,640);const d=devicePixelRatio||1;cv.style.width=cv.style.height=W+'px';cv.width=cv.height=Math.round(W*d);ctx.setTransform(d,0,0,d,0,0)}
function setMode(m){mode=m;$('t-sieve').setAttribute('aria-pressed',m==='sieve');$('t-ulam').setAttribute('aria-pressed',m==='ulam');$('t-gap').setAttribute('aria-pressed',m==='gaps');
const c=CFG[m],n=$('n');n.min=c.min;n.max=c.max;n.step=m==='sieve'?10:100;n.value=c.val;
$('key').innerHTML=c.key.map(k=>`<span><i style="background:var(${k[0]})"></i>${k[1]}</span>`).join('');reset()}
function setPlay(p){playing=p;$('play').textContent=p?'Pause':(finished()?'Replay':'Play')}
function reset(){N=+$('n').value;CFG[mode].val=N;$('nv').textContent=N;acc=0;
if(mode==='sieve')st={s:new Uint8Array(N+1),p:2,m:0,done:false};
else if(mode==='gaps'){const pr=new Uint8Array(N+1).fill(1);pr[0]=pr[1]=0;for(let i=2;i*i<=N;i++)if(pr[i])for(let j=i*i;j<=N;j+=i)pr[j]=0;
const ps=[];for(let i=2;i<=N;i++)if(pr[i])ps.push(i);
const gp=[],isRec=new Uint8Array(ps.length);let mx=0;
for(let i=1;i<ps.length;i++){const g=ps[i]-ps[i-1];gp.push(g);if(g>mx){mx=g;isRec[i-1]=1}}
st={ps,gp,isRec,i:0,max:mx}}
else{const pr=new Uint8Array(N+1).fill(1);pr[0]=pr[1]=0;for(let i=2;i*i<=N;i++)if(pr[i])for(let j=i*i;j<=N;j+=i)pr[j]=0;
const xs=[0],ys=[0];let x=0,y=0,dx=1,dy=0,len=1,seg=0;
for(let i=2;i<=N;i++){x+=dx;y+=dy;xs.push(x);ys.push(y);if(++seg===len){seg=0;[dx,dy]=[dy,-dx];if(dy===0)len++}}
st={pr,xs,ys,i:0}}
setPlay(false);draw()}
function finished(){return mode==='sieve'?st.done:mode==='gaps'?st.i>=st.gp.length:st.i>=N}
function adv(){
if(mode==='gaps'){if(st.i<st.gp.length)st.i++;return}
if(mode==='ulam'){if(st.i<N)st.i++;return}
if(st.done)return;const s=st.s;
if(st.m===0){while(st.p*st.p<=N&&s[st.p]===2)st.p++;
if(st.p*st.p>N){for(let i=2;i<=N;i++)if(!s[i])s[i]=1;st.done=true;return}
s[st.p]=1;st.m=st.p*st.p;return}
if(st.m>N){st.p++;st.m=0;return}
if(!s[st.m])s[st.m]=2;st.m+=st.p}
function draw(){
ctx.clearRect(0,0,W,W);
if(mode==='sieve')drawSieve();else if(mode==='gaps')drawGaps();else drawUlam();
}
function drawSieve(){
const cols=Math.ceil(Math.sqrt(N)),rows=Math.ceil(N/cols),cs=W/cols,s=st.s;
const cCard=css('--card'),cPr=css('--pr'),cCo=css('--co'),cMk=css('--mk'),cHi=css('--hi'),cPt=css('--prt'),cMu=css('--mut'),cLn=css('--line');
const fs=Math.max(7,Math.min(cs*.42,16));ctx.font=`${fs}px "Segoe UI",system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
let cnt=0;
for(let n=1;n<=N;n++){
const r=Math.floor((n-1)/cols),c=(n-1)%cols,x=c*cs,y=r*cs;
let bg=cCard,fg=cMu;
if(n===1){bg=cCo}
else if(s[n]===1){bg=cPr;fg=cPt;cnt++}
else if(s[n]===2){bg=cCo}
if(!st.done&&st.m>0&&n>st.p*st.p-1&&n%st.p===0&&s[n]===2&&n<st.m)bg=cMk;
if(n===st.m&&!st.done){bg=cHi;fg='#fff'}
ctx.fillStyle=bg;ctx.fillRect(x+1,y+1,cs-2,cs-2);
if(cs>=14){ctx.fillStyle=fg;ctx.fillText(n,x+cs/2,y+cs/2+.5)}}
if(!st.done&&st.m>0){const p=st.p,c=(p-1)%cols,r=Math.floor((p-1)/cols);ctx.strokeStyle=cHi;ctx.lineWidth=2;ctx.strokeRect(c*cs+1,r*cs+1,cs-2,cs-2)}
let msg;
if(st.done)msg=`Done. Every number left standing is prime: ${cnt} primes up to ${N}.`;
else if(st.m===0)msg='Looking for the next number that has not been crossed out.';
else msg=`${st.p} is prime. Crossing out its multiples, starting at ${st.p}×${st.p} = ${st.p*st.p}.`;
$('info').textContent=msg;$('stat').textContent=`Primes confirmed: ${cnt}`}
function drawUlam(){
const side=Math.ceil(Math.sqrt(N))+1,cs=W/side,off=side/2,cPr=css('--pr'),cHi=css('--hi'),cCo=css('--co');
const rad=Math.max(.7,cs*.38);let cnt=0;
for(let n=1;n<=st.i;n++){
const x=(st.xs[n-1]+off)*cs,y=(st.ys[n-1]+off)*cs;
if(st.pr[n]){cnt++;ctx.fillStyle=cPr;if(rad<2)ctx.fillRect(x-rad,y-rad,rad*2,rad*2);else{ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fill()}}
else if(cs>6){ctx.fillStyle=cCo;ctx.beginPath();ctx.arc(x,y,rad*.35,0,7);ctx.fill()}}
if(st.i>0){const n=st.i,x=(st.xs[n-1]+off)*cs,y=(st.ys[n-1]+off)*cs;ctx.strokeStyle=cHi;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,rad+3,0,7);ctx.stroke()}
const n=st.i;
$('info').textContent=n===0?'Numbers spiral outward from 1. Primes get a dot. Press Play and watch for diagonal lines.':
`${n} is ${st.pr[n]?'prime':'not prime'}.${finished()?' Primes cluster along diagonals, which nobody has fully explained.':''}`;
$('stat').textContent=`Shown: ${n} · Primes: ${cnt}`}
function drawGaps(){
const {ps,gp,isRec,i,max}=st,G=gp.length,cols=Math.floor(W),top=max+2;
const cPr=css('--pr'),cMu=css('--mut'),cHi=css('--hi'),cLn=css('--line');
for(let c=0;c<cols;c++){
const a=Math.floor(c*G/cols),b=Math.max(a+1,Math.floor((c+1)*G/cols));
if(cols/G>4&&c>0&&a!==Math.floor((c-1)*G/cols))continue;
let best=0,rec=false;
for(let k=a;k<b&&k<i;k++){const g=gp[k];if(g>best||(g===best&&isRec[k])){best=g;rec=!!isRec[k]}}
if(!best)continue;
const h=best/top*(W-8);
ctx.fillStyle=rec?cHi:best===2?cPr:cMu;ctx.fillRect(c,W-h,1,h)}
ctx.fillStyle=cLn;ctx.fillRect(0,W-1,W,1);
let tw=0,cur=0,ri=-1;
for(let k=0;k<i;k++){if(gp[k]===2)tw++;if(gp[k]>cur)cur=gp[k];if(isRec[k])ri=k}
let msg;
if(i===0)msg='Each bar is the distance from one prime to the next. Press Play and watch for the tall ones.';
else if(finished())msg=`Largest gap up to ${N} is ${cur}, between ${ps[ri]} and ${ps[ri+1]}. The average gap near ${N} is about ${Math.log(N).toFixed(1)}.`;
else msg=`The gap from ${ps[i-1]} to ${ps[i]} is ${gp[i-1]}.${isRec[i-1]?' That is a new record.':''}`;
$('info').textContent=msg;
$('stat').textContent=`Gaps shown: ${i} · Twin prime pairs: ${tw} · Largest gap: ${cur}`}
let last=0;
function tick(t){
if(playing){const sp=+$('sp').value;acc+=(mode==='sieve'?sp*.5*Math.max(1,N/200):mode==='gaps'?sp*sp*.5*Math.max(1,st.gp.length/300):sp*sp*.5*Math.max(1,N/2500));
while(acc>=1&&!finished()){acc--;adv()}
if(finished()){acc=0;setPlay(false)}}
draw();requestAnimationFrame(tick)}
$('play').onclick=()=>{if(finished())reset();setPlay(!playing)};
$('step').onclick=()=>{setPlay(false);adv();$('play').textContent=finished()?'Replay':'Play'};
$('reset').onclick=reset;
$('n').oninput=reset;
$('sp').oninput=e=>$('spv').textContent=e.target.value;
$('t-sieve').onclick=()=>setMode('sieve');
$('t-ulam').onclick=()=>setMode('ulam');
$('t-gap').onclick=()=>setMode('gaps');
addEventListener('resize',()=>{fit()});
fit();setMode('sieve');requestAnimationFrame(tick);
</script></body></html>
